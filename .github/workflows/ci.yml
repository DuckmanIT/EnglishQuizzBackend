name: CI / Deploy

# Every push and PR is verified. Production is deployed only from `main`, and only after `verify` passes.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # also runs `prisma generate`
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Build production image
        run: docker build -t englishquizz-backend:${{ github.sha }} .

  deploy:
    name: Deploy to production
    needs: verify
    # Set the repository variable PRODUCTION_DEPLOY=true once hosting and secrets are configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production # set PRODUCTION_DIRECT_URL and DEPLOY_HOOK_URL as secrets of this environment
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
      - name: Trigger deploy on the hosting platform
        run: curl --fail -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
